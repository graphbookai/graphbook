# Simple workflow for deploying static content to GitHub Pages
name: Deploy Graphbook Docs

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/static.yml"

  # Fired by graphbookai/nebo's deploy-docs.yml when nebo's docs change.
  # Payload: { nebo_sha: <commit sha to build> }.
  repository_dispatch:
    types: [nebo-docs-updated]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      nebo_ref:
        description: "graphbookai/nebo ref to build (branch, tag, or sha)"
        required: false
        default: "main"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve nebo ref
        id: nebo_ref
        run: |
          ref="${{ github.event.client_payload.nebo_sha || inputs.nebo_ref || 'main' }}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout graphbook
        uses: actions/checkout@v4
      - name: Checkout nebo
        uses: actions/checkout@v4
        with:
          repository: graphbookai/nebo
          ref: ${{ steps.nebo_ref.outputs.ref }}
          path: _nebo
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build Graphbook Docs
        run: |
          uv sync --group dev --group peer
          uv run make docs
      - name: Build Nebo Docs into _build/html/nebo
        working-directory: _nebo
        run: |
          uv sync --all-groups
          uv run sphinx-build -b html -d _build/doctrees docs ../docs/_build/html/nebo
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'docs/_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
